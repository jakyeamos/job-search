name: Release Please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # This fork does not carry the upstream scaffolder/ npm package, so
      # release-please-config.json here only tracks the "." component and
      # there is no publish step.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
