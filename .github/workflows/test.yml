name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # This fork carries dashboard/ but not the full upstream monorepo
      # (scaffolder/, web/, and their internal test scripts), so test-all.mjs
      # is not applicable here. Go dashboard tests are the only in-repo suite.
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
